<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Claus Laikku — Developer and Technical Expert">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1030"/>
      <stop offset="0.38" stop-color="#5a1f4a"/>
      <stop offset="0.62" stop-color="#b8475a"/>
      <stop offset="0.8" stop-color="#f08a4b"/>
      <stop offset="1" stop-color="#ffc977"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe3a3" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffb066" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f08a4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140b1c" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#0d0712" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="380" rx="18"/></clipPath>
    <style>
      .name{font:800 64px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff4e6;letter-spacing:1px}
      .role{font:600 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#ffd9a8;letter-spacing:3px}
      .loc{font:500 16px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f6c6b0;letter-spacing:2px}
      .mono{font:500 15px Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
      .p{fill:#f08a4b}.c{fill:#f3e6dc}.o{fill:#b9a3c9}.g{fill:#8fd694}
      .star{fill:#fff;animation:tw 3.2s ease-in-out infinite}
      .s2{animation-delay:.8s}.s3{animation-delay:1.6s}.s4{animation-delay:2.4s}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
      .sun{animation:rise 6s ease-in-out infinite alternate}
      @keyframes rise{from{transform:translateY(6px)}to{transform:translateY(-6px)}}
      .bird{animation:fly 14s linear infinite}
      @keyframes fly{from{transform:translate(-80px,0)}to{transform:translate(1280px,-40px)}}
      .l{opacity:0;animation:show .01s forwards}
      .l1{animation-delay:.4s}.l2{animation-delay:1.1s}.l3{animation-delay:1.9s}.l4{animation-delay:2.6s}.l5{animation-delay:3.4s}.l6{animation-delay:4.1s}.l7{animation-delay:4.8s}
      @keyframes show{to{opacity:1}}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .fade{opacity:0;animation:in 1.2s ease-out .2s forwards}
      @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#sky)"/>

    <!-- stars -->
    <circle class="star" cx="80" cy="40" r="1.6"/>
    <circle class="star s2" cx="210" cy="72" r="1.2"/>
    <circle class="star s3" cx="340" cy="28" r="1.5"/>
    <circle class="star s4" cx="470" cy="60" r="1.1"/>
    <circle class="star" cx="610" cy="22" r="1.4"/>
    <circle class="star s3" cx="720" cy="54" r="1.2"/>
    <circle class="star s2" cx="905" cy="20" r="1.5"/>
    <circle class="star s4" cx="1040" cy="44" r="1.3"/>
    <circle class="star" cx="1150" cy="26" r="1.1"/>

    <!-- sun -->
    <g class="sun">
      <circle cx="655" cy="250" r="170" fill="url(#sunGlow)"/>
      <circle cx="655" cy="250" r="62" fill="#ffd98f" opacity="0.95"/>
    </g>

    <!-- bird -->
    <path class="bird" d="M0 120 q8 -8 16 0 q8 -8 16 0" stroke="#3a1530" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <!-- ridges -->
    <path d="M0 262 L90 220 L170 248 L270 196 L360 236 L450 206 L560 244 L660 200 L760 236 L860 192 L960 230 L1060 204 L1200 240 L1200 380 L0 380 Z" fill="#c4555a" opacity="0.75"/>
    <path d="M0 292 L110 248 L200 276 L310 236 L410 270 L520 240 L620 280 L730 238 L840 272 L950 240 L1060 270 L1200 246 L1200 380 L0 380 Z" fill="#8a2f4c"/>
    <path d="M0 322 L130 286 L240 312 L360 280 L470 310 L590 284 L700 314 L820 282 L940 308 L1070 284 L1200 304 L1200 380 L0 380 Z" fill="#4e1a3a"/>

    <!-- pines -->
    <g fill="#24102a">
      <path d="M0 380 L0 330 L40 336 L60 318 L90 330 L130 312 L170 334 L230 326 L300 340 L380 330 L460 344 L560 334 L660 346 L760 334 L860 344 L960 330 L1040 340 L1120 326 L1200 336 L1200 380 Z"/>
      <path d="M60 352 L72 300 L84 352 Z M150 356 L166 286 L182 356 Z M1010 354 L1024 296 L1038 354 Z M1100 356 L1118 280 L1136 356 Z M1160 356 L1172 306 L1184 356 Z M24 358 L34 318 L44 358 Z"/>
    </g>

    <!-- name block -->
    <g class="fade">
      <text x="56" y="128" class="role">DEVELOPER · TECHNICAL EXPERT · BUILDER</text>
      <text x="52" y="196" class="name">Claus Laikku</text>
      <text x="56" y="232" class="loc">📍 JYVÄSKYLÄ, FINLAND  ·  FOUNDER OF HAVAIDA OY</text>
    </g>

    <!-- terminal -->
    <g transform="translate(744 70)">
      <rect width="414" height="206" rx="12" fill="url(#term)" stroke="#f08a4b" stroke-opacity="0.35"/>
      <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
      <circle cx="38" cy="18" r="5" fill="#febc2e"/>
      <circle cx="56" cy="18" r="5" fill="#28c840"/>
      <text x="207" y="23" text-anchor="middle" class="mono o" style="font-size:12px">claus@laikku.dev: ~</text>
      <text x="18" y="56" class="mono l l1"><tspan class="p">$</tspan><tspan class="c"> whoami</tspan></text>
      <text x="18" y="78" class="mono o l l2">developer &amp; tech support, 5+ yrs in IT</text>
      <text x="18" y="106" class="mono l l3"><tspan class="p">$</tspan><tspan class="c"> cat stack.txt</tspan></text>
      <text x="18" y="128" class="mono o l l4">react · typescript · three.js · supabase</text>
      <text x="18" y="156" class="mono l l5"><tspan class="p">$</tspan><tspan class="c"> ./havaida --build</tspan></text>
      <text x="18" y="178" class="mono g l l6">✔ shipping ideas from Finland</text>
      <text x="18" y="196" class="mono l l7"><tspan class="p">$</tspan><tspan class="c cur"> ▌</tspan></text>
    </g>
  </g>
</svg>
